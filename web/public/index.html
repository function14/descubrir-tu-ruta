<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descubrir tu Ruta</title>
  <meta name="description" content="Sistema experto que ordena los destinos turísticos de Colombia según tu tipo de viaje y explica por qué.">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <button class="marca" id="marca" type="button">
      <span class="marca-punto" aria-hidden="true"></span>
      Descubrir tu Ruta
    </button>
  </header>

  <main class="contenido">
    <section id="inicio" class="vista inicio">
      <h1>¿A dónde te lleva tu próximo viaje?</h1>
      <p class="entrada">Responde unas pocas preguntas y un sistema experto ordena los destinos de Colombia de mayor a menor peso, mostrando las reglas que lo llevaron a cada uno.</p>
      <button class="boton" id="comenzar" type="button">Comenzar</button>
      <ol class="ruta-portada" id="ruta-portada" aria-hidden="true"></ol>
    </section>

    <section id="cuestionario" class="vista" hidden>
      <ol id="ruta" class="ruta" aria-label="Tus respuestas hasta ahora"></ol>
      <div id="pregunta-bloque" aria-live="polite">
        <p class="parada" id="parada"></p>
        <h2 id="pregunta" tabindex="-1"></h2>
        <div id="opciones" class="opciones"></div>
      </div>
      <button class="enlace" id="atras" type="button" hidden>Volver a la pregunta anterior</button>
    </section>

    <section id="cargando" class="vista estado" role="status" hidden>
      <span class="giro" aria-hidden="true"></span>
      <p id="cargando-texto"></p>
    </section>

    <section id="error" class="vista estado" role="alert" hidden>
      <h2>No pudimos completar la consulta</h2>
      <p id="error-texto"></p>
      <button class="boton" id="reintentar" type="button">Intentar de nuevo</button>
    </section>

    <section id="resultados" class="vista" hidden>
      <h2 id="resultados-titulo" tabindex="-1">Tus destinos</h2>
      <p class="entrada" id="resultados-mensaje"></p>
      <ol id="lista-destinos" class="destinos"></ol>
      <div class="pie-resultados">
        <p class="traza" id="traza"></p>
        <button class="boton" id="otra-vez" type="button">Hacer otra consulta</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
